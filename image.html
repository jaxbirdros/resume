 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jaylyn | Images Gallery</title>
<link rel="stylesheet" href="style.css">
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f7f7f7;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px;
  }

  h1 {
    text-align: center;
    margin-bottom: 40px;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 30px;
    width: 100%;
    max-width: 1200px;
  }

  .card {
    perspective: 1000px; /* enables 3D */
  }

  .card-inner {
    position: relative;
    width: 100%;
    padding-top: 100%; /* makes square cards */
    transform-style: preserve-3d;
    transition: transform 0.8s;
  }

  .card:hover .card-inner {
    transform: rotateY(180deg);
  }

  .card-front, .card-back {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    border-radius: 12px;
    backface-visibility: hidden;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }

  .card-front img, .card-back img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .card-back {
    transform: rotateY(180deg);
  }

  /* Optional: dark mode support */
  body.dark-mode {
    background: #000;
  }

</style>
</head>
